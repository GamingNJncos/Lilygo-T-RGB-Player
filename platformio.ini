; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = examples/WiFiGifPlayer
boards_dir = boards

[env:T-RGB]
lib_extra_dirs = ${PROJECT_DIR}
platform = espressif32@6.9.0
board = LilyGo-T-RGB
framework = arduino
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
    default
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    ; USB serial printing on boot — disable for battery-only operation
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -UARDUINO_USB_CDC_ON_BOOT
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lvgl/lvgl @ 8.4.0
    lewisxhe/SensorLib @ 0.2.3
    bodmer/TFT_eSPI @ 2.5.43
    moononournation/GFX Library for Arduino @ 1.5.0
    FS
    SPIFFS

debug_tool = esp-builtin
debug_speed = 500
platform_packages = tool-openocd
